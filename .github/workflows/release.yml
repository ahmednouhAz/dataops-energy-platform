name: Release

# Builds the pipeline image (the same Dockerfile docker-compose.yml's
# `worker` service builds locally) and publishes it to GHCR, tagged with
# the git tag that triggered the run plus `latest` -- step 15's "Docker
# images published to GHCR on each tag". Separate from ci.yml on
# purpose: this never runs on a plain PR/push, only on an actual version
# tag, so a bad commit on main can't accidentally publish a new "prod"
# image -- publishing is a deliberate act (`git tag vX.Y.Z && git push
# --tags`), not a side effect of merging.
on:
  push:
    tags:
      - "v*"

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - uses: docker/metadata-action@v5
        id: meta
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          tags: |
            type=semver,pattern={{version}}
            type=raw,value=latest

      - uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
